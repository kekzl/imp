# File-size thresholds + classification for tools/check_filesize.py
#
# WHY THIS EXISTS
# --------------
# imp is ~160k LOC of C++20/CUDA. Every .cu is its own translation unit, and the
# real cost of an oversized file is not readability — it is RECOMPILE BLAST RADIUS:
# touching one kernel in a 1500-LOC .cu forces nvcc to re-ptxas the entire TU
# (the slowest part of an sm_120a build) with zero parallelism. Headers are worse:
# a fat .cuh re-triggers every TU that includes it. Line count is only a *proxy*
# for that cost — these thresholds are smells, not hard rules. See docs/audit/AUDIT_FILESIZE.md
# for the per-file baseline and AGENTS.md "File Layout & Size".
#
# METRIC: thresholds apply to CODE LOC (blank + comment lines stripped by an honest
# C/C++ state machine that ignores // and /* */ inside string/char literals). RAW
# LOC is reported alongside but never gates — heavy doc-comments must not trip it.
#
# THRESHOLD RATIONALE (derived from the Phase-1 distribution, NOT reverse-fit to
# make the baseline trivially green — real over-hard counts are 19 kernel / 17 TU /
# 1 header, all listed in [allow] with a reason):
#   - kernel .cu (hot-path compute/quant/exec): strictest. A kernel TU's ptxas pass
#     dominates incremental builds, so warn early (>500) and hard-review at >600.
#   - normal TU (.cpp / non-kernel .cu): host code compiles far faster and these
#     legitimately host loaders/schedulers/test suites → warn >600, hard-review >800.
#   - header (.h/.hpp/.cuh): a change fans out to every includer. warn >500,
#     hard-review >700 (kept above the kernel warn because most headers are tiny —
#     p90 is ~113 code LOC — so a header past 500 is already a strong outlier).

[thresholds.kernel]
warn = 500
hard = 600

[thresholds.tu]
warn = 600
hard = 800

[thresholds.header]
warn = 500
hard = 700

[classify]
# A .cu under one of these path prefixes is a hot-path "kernel" TU (stricter
# thresholds). Everything else .cu/.cpp is a normal TU.
kernel_dirs = ["src/compute/", "src/quant/", "src/exec/"]
# Anything with one of these extensions is a header (fans out to includers).
header_ext = [".cuh", ".hpp", ".h"]
# Directory roots scanned by the audit + the gate.
roots = ["src", "tools", "tests"]

[allow]
# Allowlist: files that EXCEED their hard-review threshold today and are accepted
# into the baseline. An entry is a CEILING, not an exemption: `code_loc` is the
# measured code LOC at the time of pinning and the gate fails when the file drifts
# from it in either direction. Re-pin with `python3 tools/check_filesize.py --update`
# and say in the PR body which way it moved.
#
# Why the ceiling exists: before 2026-08-21 an [allow] entry removed the file from
# the gate entirely, so the 29 allowlisted files were the only ones in the tree with
# no size limit at all - exactly the files where recompile blast radius is worst.
# Sixteen had grown past the code-LOC figure their own reason cited, `engine_scheduler.cpp`
# by 83 % (1074 -> 1962), with every CI run green throughout.
#
# `reason` is mandatory (an empty one is rejected) and no longer carries the LOC
# figure, because that is the part that went stale. Classification letter:
# (a) bundles independent concepts -> split candidate; (b) explicit template
# instantiations inline; (c) legitimately monolithic (one cohesive unit / test target).
