# CCN ratchet baseline for tools/check_complexity.py (#2210)
#
# Threshold 25: lizard's "hard to test" band; 203 functions in src/ exceeded it
# on 467bd5f8 (lizard 1.17.31), 148 of them below the 200-LOC function-size warn.
# This counter: 202 (lizard's #203 is the executor_attention_prefill.cu fragment,
# charged here to run_attention); 3789 of 3821 shared functions equal lizard's CCN.
# Every entry is a CEILING: growth by 1 fails, shrinking is a NOTE.
# Pins only shrink: scripts/ci_static_gates.sh passes the base branch's copy as
# --base-config; an added or raised pin fails (#2210). Lower pins with `--update`.
# Key: `path::signature`, as in function_size_thresholds.toml. Lines below
# [baseline] are generated.
#
# Pin changes (newest first):
#   #2212 item 3 (mtp_feed per-row body shared): mtp_feed_rows_multislot 50 -> 30, mtp_feed_batch 35 -> 15
#   (below threshold, entry removed); new mtp_feed_dense_rows 9 is under the threshold
#   #2159 (HF tokenizer parity, written before the ratchet): Tokenizer::load 99 -> 116 (NFC normalizer,
#   Split-sequence steps, added-token strip; 139 before helpers split out), encode_gpt2 41 -> 44,
#   load_gguf 244 -> 245, new parse_class 27 (tokenizer_pretok.cpp regex class parser)
#   #2177 (Qwen3.8-Flash-Next MTP draft forward, written before the ratchet): new mtp_emit_token 27,
#   mtp_workspace_allocate 36; grew run_moe_ffn +1, ple_run_ +3, chunk_capture_supported +1,
#   dispatch_mtp_head +4, engine_scheduler step +1, engine_spec_mtp +8/+1, engine_spec_ngram +3
#   compute_vram_budget 92 -> 93: grew +1 by #2228 (#2224 qtype rule, lm_head_source_only branch)

[thresholds]
cyclomatic = 25

[scan]
roots = ["src"]
skip_dirs = []

