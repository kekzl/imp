# imp-server only. Open WebUI + Prometheus + Grafana on top of it:
#   docker compose -f docker-compose.full.yml up -d

services:
  imp-server:
    build:
      context: .
    image: imp:latest
    restart: unless-stopped
    # SIGTERM drains in-flight generations for server.model_swap_drain_ms
    # (60 s default) before the engine stops; the compose default of 10 s
    # SIGKILLed a draining server (AUDIT_ARCH_2026 E-6).
    stop_grace_period: 75s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      # Bound to loopback by default (#1619). `"8080:8080"` publishes on every
      # interface, and this image has no authentication unless IMP_API_KEY is
      # set, so the shipped default was an open inference API on the LAN.
      # To expose it deliberately: IMP_BIND=0.0.0.0 plus IMP_API_KEY.
      - "${IMP_BIND:-127.0.0.1}:${IMP_PORT:-8080}:${IMP_PORT:-8080}"
    volumes:
      - ${IMP_MODELS_DIR:-./models}:/models
      # Survives `up --force-recreate` and image updates. Holds the
      # library-reserve measurement (a model that charges the 3900 MiB constant
      # instead of its measured value gives up that much KV pool — 2725 MiB on
      # Qwen3.6-35B-A3B-UD-Q4_K_M) and the warm weight cache (#956, cold boots
      # skip weight conversion). Both are rebuilt if the volume is dropped.
      - imp-cache:/home/imp/.cache/imp
    environment:
      - IMP_MODEL=${IMP_MODEL:-}
      - IMP_HOST=0.0.0.0
      # Empty = no authentication. Required if IMP_BIND is widened.
      - IMP_API_KEY=${IMP_API_KEY:-}
      - IMP_TRUSTED_PROXY=${IMP_TRUSTED_PROXY:-}
      - IMP_PORT=${IMP_PORT:-8080}
      - IMP_MAX_TOKENS=${IMP_MAX_TOKENS:-}
      - IMP_CHAT_TEMPLATE=${IMP_CHAT_TEMPLATE:-auto}
      - IMP_KV_FP8=${IMP_KV_FP8:-}
      - IMP_KV_INT8=${IMP_KV_INT8:-}
      - IMP_DECODE_NVFP4=${IMP_DECODE_NVFP4:-}
      - IMP_NO_CUDA_GRAPHS=${IMP_NO_CUDA_GRAPHS:-}
      - IMP_SSM_FP16=${IMP_SSM_FP16:-}
      - IMP_MMPROJ=${IMP_MMPROJ:-}
      - IMP_PREFILL_CHUNK_SIZE=${IMP_PREFILL_CHUNK_SIZE:-}
      - IMP_THINK_BUDGET=${IMP_THINK_BUDGET:-}
      # Everything above is one hand-written name per setting and is frozen at
      # that list. These two reach every imp.conf key instead:
      # IMP_SET="attention.sparse_topk_tokens=8192 kv_cache.growable=true"
      - IMP_CONFIG=${IMP_CONFIG:-}
      - IMP_SET=${IMP_SET:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${IMP_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

volumes:
  imp-cache:
