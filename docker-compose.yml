services:
  imp-server:
    build:
      context: .
    image: imp:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${IMP_PORT:-8080}:${IMP_PORT:-8080}"
    volumes:
      - ${IMP_MODELS_DIR:-./models}:/models
      # Survives `up --force-recreate` and image updates. Holds the
      # library-reserve measurement (a model that charges the 3900 MiB constant
      # instead of its measured value gives up that much KV pool — 2725 MiB on
      # Qwen3.6-35B-A3B-UD-Q4_K_M) and the warm weight cache (#956, cold boots
      # skip weight conversion). Both are rebuilt if the volume is dropped.
      - imp-cache:/home/imp/.cache/imp
    environment:
      - IMP_MODEL=${IMP_MODEL:-}
      - IMP_HOST=0.0.0.0
      - IMP_PORT=${IMP_PORT:-8080}
      - IMP_MAX_TOKENS=${IMP_MAX_TOKENS:-}
      - IMP_CHAT_TEMPLATE=${IMP_CHAT_TEMPLATE:-auto}
      - IMP_KV_FP8=${IMP_KV_FP8:-}
      - IMP_KV_INT8=${IMP_KV_INT8:-}
      - IMP_DECODE_NVFP4=${IMP_DECODE_NVFP4:-}
      - IMP_NO_CUDA_GRAPHS=${IMP_NO_CUDA_GRAPHS:-}
      - IMP_SSM_FP16=${IMP_SSM_FP16:-}
      - IMP_MMPROJ=${IMP_MMPROJ:-}
      - IMP_PREFILL_CHUNK_SIZE=${IMP_PREFILL_CHUNK_SIZE:-}
      - IMP_THINK_BUDGET=${IMP_THINK_BUDGET:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${IMP_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://imp-server:${IMP_PORT:-8080}/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=false
      - ENABLE_OLLAMA_API=false

      # --- Tool support ---
      # Native function calling: model emits tool_calls JSON, Open WebUI dispatches.
      # imp's chat-template plumbing already handles this; per-model toggle still
      # lives in the UI (Settings → Models → [model] → Advanced → Function Calling).
      - ENABLE_DIRECT_CONNECTIONS=true

      # Built-in Web Search (DuckDuckGo — no API key needed). User toggles the
      # globe icon in the chat input to enable per-message.
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=duckduckgo
      - RAG_WEB_SEARCH_RESULT_COUNT=3
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      - ENABLE_SEARCH_QUERY_GENERATION=true

      # URL fetching from chat (paste a URL, Open WebUI loads + indexes).
      - ENABLE_RAG_LOCAL_WEB_FETCH=true
      - RAG_WEB_LOADER_ENGINE=safe_web

      # Code Interpreter — runs Python in the browser via Pyodide (no sandbox
      # service needed, no host risk).
      - ENABLE_CODE_INTERPRETER=true
      - CODE_EXECUTION_ENGINE=pyodide
      - CODE_INTERPRETER_ENGINE=pyodide

      # User-defined Tools / Functions (admin UI: Workspace → Tools / Functions).
      - ENABLE_COMMUNITY_SHARING=false
    depends_on:
      imp-server:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      imp-server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_FEATURE_TOGGLES_ENABLE=
    depends_on:
      - prometheus

volumes:
  imp-cache:
  open-webui:
  prometheus-data:
  grafana-data:
