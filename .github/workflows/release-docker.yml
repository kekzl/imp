name: Release Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild (e.g. v0.44.0): builds that tag with the Dockerfile of the dispatch ref. "manual" builds the dispatch ref.'
        required: false
        default: 'manual'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-24.04
    # Cold compile every release (the ccache mount does not survive the runner).
    timeout-minutes: 150

    env:
      # Release tag this run publishes; empty for a "manual" dispatch.
      TAG: ${{ github.event.release.tag_name || (inputs.tag != 'manual' && inputs.tag) || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rebuild of a release whose image failed: source from the tag, Dockerfile
      # from the dispatch ref (v0.43.0/v0.44.0 OOM-killed the runner at -j$(nproc)).
      - name: Check out the release tag
        if: github.event_name == 'workflow_dispatch' && env.TAG != ''
        run: |
          set -euo pipefail
          cp Dockerfile /tmp/Dockerfile.dispatch
          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          cp /tmp/Dockerfile.dispatch Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Is this release the newest version, or an older one published late?
      #
      # The moving tags (`latest`, `{{major}}`) must only ever move FORWARD.
      # They did not: v0.22.0 was created on 2026-08-05 but published on
      # 2026-08-13, five hours after v0.25.0 — and since this workflow fires on
      # `release: published` and set `latest` for every non-prerelease, the
      # older image took both `latest` and `0`. Anyone pulling
      # ghcr.io/kekzl/imp:latest got a three-release-old build, with nothing to
      # indicate it. GitHub's own "Latest" badge kept pointing at v0.25.0,
      # because it sorts by version rather than publish time.
      #
      # Compare against every published tag with sort -V rather than the API's
      # /releases/latest, which sorts by created_at and would have called this
      # backfill "latest" too.
      - name: Is this the newest release
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          this="$TAG"
          if [ -z "$this" ]; then echo "newest=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          highest=$(gh api --paginate /repos/${{ github.repository }}/releases \
                      --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' \
                    | sort -V | tail -1)
          echo "this=$this highest=$highest"
          if [ "$this" = "$highest" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$this is not the newest release ($highest) — keeping the moving tags where they are."
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ steps.newest.outputs.newest == 'true' }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.newest == 'true' && !github.event.release.prerelease }}
            type=raw,value=manual,enable=${{ env.TAG == '' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Ship imp-bench in the released image — it is documented (docs/usage.md)
          # and the only standalone microbench entry point. CI keeps it OFF for
          # speed; the release image is built once, so the ~30-60s is fine (#760).
          build-args: |
            IMP_BUILD_BENCH=ON
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # First-time package visibility must be flipped to public manually:
      # GitHub repo → Packages → imp → Package settings → Change visibility → Public.
      # GITHUB_TOKEN cannot set this; subsequent pushes inherit the chosen visibility.
