name: CI image

# Builds .github/ci-image/Dockerfile and publishes ghcr.io/<owner>/imp-ci. ci.yml pins the digest
# this run prints; a PR that touches the Dockerfile only builds it (no push).
on:
  push:
    branches: [main]
    paths:
      - .github/ci-image/**
      - .github/workflows/ci-image.yml
  pull_request:
    branches: [main]
    paths:
      - .github/ci-image/**
      - .github/workflows/ci-image.yml
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: Build CI image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Job scope: the GHCR push is the only write.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/imp-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag = CUDA version of the base image; the commit tag keeps every published build addressable.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/ci-image
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:cuda13.5
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=imp CI toolchain (CUDA 13.5 nvcc, cuBLAS, cmake, ninja, ccache)

      - name: Digest for ci.yml
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE:cuda13.5@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
