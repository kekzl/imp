name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run CI against a ref on demand: `gh workflow run CI --ref main`.
  #
  # Needed when a squash merge performed by AUTO-MERGE does not start a
  # workflow run: armed with GITHUB_TOKEN (auto-merge.yml falls back to it while
  # the AUTO_MERGE_TOKEN secret is unset), the merge is attributed to that token,
  # and events created by GITHUB_TOKEN do not trigger further runs — GitHub's
  # loop prevention. A merge a human clicks, or one armed with the PAT, does fire.
  # So `main`'s newest CI run can be many commits old and show a state that has
  # since been fixed: on 2026-08-01 it still displayed seven warnings that main
  # no longer had. Coverage is not lost (the PR run builds the tree that gets
  # squashed), but the branch's reported status is stale, and this makes it
  # refreshable without a PAT or a merge queue.
  workflow_dispatch:
  # Nightly, 03:17 UTC: refreshes `main`'s reported status (an auto-merge squash
  # armed with GITHUB_TOKEN starts no run, see above), runs Sanitizers without
  # its path filter, the libFuzzer job and the imp-bench build. No job here uses a GPU: there is no
  # GPU runner (docs/DESIGN_DECISIONS.md), GPU gates are local (`make verify-fast`).
  schedule:
    - cron: "17 3 * * *"

# A new push to a PR cancels its older run; main and schedule runs never cancel.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repo; artifacts and caches need no token scope.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.changes.outputs.code }}

    container:
      # .github/ci-image/Dockerfile (1104 MB compressed; nvidia/cuda devel was 5007 MB, median 72 s pull):
      # nvcc, cuBLAS, git, python3, cmake, ninja, ccache preinstalled, so no job runs apt for its toolchain.
      # Ubuntu 26.04, GCC 15.2: same libstdc++ 15 as the release image (#903).
      image: ghcr.io/kekzl/imp-ci:cuda13.5@sha256:d9b67d58c7af2a54e70cf1a996d8c5381f90661f2629ab36abaa639615f24e5c

    env:
      # CUDA toolchain version — used by the verify step and cache keys. Kept in
      # sync with the container image tag above (bump both to move CI).
      CUDA_VERSION: "13.5"
      CCACHE_DIR: /github/home/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so the base SHA is present for `git diff`

      # git refuses this checkout on ownership inside the container: the
      # Actions runner owns /__w/imp/imp and the job's user does not. Without
      # this, any gate that shells out to git dies - check-release.sh:11 got an
      # empty `git rev-parse` and cd'd to nothing, which failed the required
      # check for a reason that had nothing to do with the tree.
      #
      # This has to come BEFORE the detection step below, and did not: the step
      # was the FIRST git caller in the job, its `git cat-file` died on exactly
      # this ownership refusal with stderr suppressed, and the fail-open handed
      # back code=true on every run. Proof from run 34412431017, whose diff is
      # two files and neither is code:
      #   non-docs changes: code=true (src|tools .cpp: true)
      #   changed files:
      # with nothing after "changed files:" - an empty `files`, so no `git diff`
      # ever ran. The docs-only skip this step exists for had therefore never
      # fired once, which is why a docs-only PR still paid a ~4 min Build.
      - name: Trust the checkout (container UID differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Docs-only changes (only **/*.md or docs/** touched) skip the expensive
      # CUDA build/test below but still report the required `Build` check as
      # success — every heavy step is gated on steps.changes.outputs.code, so the
      # job goes green in seconds instead of pulling the multi-GB CUDA image,
      # configuring CUTLASS and linking. Plain `git diff` (no third-party action,
      # so no Node-deprecation churn). FAIL-OPEN: any uncertainty (no base SHA,
      # git error, empty diff) → code=true, so detection can never wrongly skip a
      # code change or leave the required check unreported.
      - name: Detect non-docs changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          code=true
          # `cpp` gates the clang-tidy steps below, which lint changed src|tools
          # *.cpp and the host side of changed src/*.cu (#2210): no apt install
          # when there is nothing to lint. Same FAIL-OPEN rule as `code`: any
          # uncertainty runs them.
          cpp=true
          # Say so when the fail-open fires. Without this the step prints a
          # perfectly normal-looking `code=true` and an empty file list, which
          # is what let a permanently-open gate go unnoticed: it looks the same
          # as a genuine code PR. A run that cannot resolve its base is a
          # detection that is not running, and should read as one.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::change detection fell open (base '${base:-<unset>}' unresolvable) - every gated step runs"
          fi
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" HEAD)"
            # code stays true unless EVERY changed file is markdown, docs/, .claude/
            # or a workflow other than ci.yml: none is a build input; 4/69 PR runs compiled 91-739 s for them.
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^\.claude/|^\.github/workflows/(codeql|auto-merge|roofline|release-docker)\.yml$)'; then
              code=false
            fi
            # `grep -c`, not `grep -q`, and no here-string. Two traps meet on
            # this line. #1499: `grep -q` exits at the first match, the producer
            # takes EPIPE and pipefail reports a non-zero pipeline for a
            # SUCCESSFUL match. And the here-string the other lanes use to dodge
            # that is a bashism - this job declares no `shell:`, so it gets
            # whatever the CUDA image provides, and `Build` is the one required
            # check (ruleset 14716423): a syntax error here fails every PR.
            # `grep -c` reads all of stdin, so nothing ever takes EPIPE, and it
            # is POSIX. `|| true` because grep exits 1 when the count is 0.
            n_cpp="$(printf '%s\n' "$files" | grep -cE '^(src|tools)/.*\.cpp$|^src/.*\.cu$' || true)"
            [ "${n_cpp:-0}" -gt 0 ] || cpp=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          printf 'non-docs changes: code=%s (src|tools .cpp or src .cu: %s)\nchanged files:\n%s\n' \
            "$code" "$cpp" "${files:-<none>}"

      # The blocking static gates, FIRST, before the compile. Ruleset 14716423
      # requires exactly one context (`Build`), so a gate that runs only as its
      # own job is advisory: #1523 merged with `File size` FAILED and #1524
      # merged over the same red gate forty minutes later (DEBT_LEDGER (j)).
      # Running them here is what makes red stop a merge. They are seconds, they
      # need no apt and no network, and putting them ahead of the build means a
      # drifted allowlist fails in ~15 s rather than after a three-minute
      # compile. The named jobs below still run the same script with a filter,
      # so `which gate failed` keeps a check name and there is one list, not two.
      # Runs on docs-only PRs too: the docs and release-hygiene gates are exactly
      # the ones a docs-only change can break.
      #
      # Started in the background, joined by "Static gates (result)" below: same
      # script, same exit code, still fails `Build`. Serial they cost a median
      # 26 s of the required check; next to a -j2 compile on 4 vCPU they are free.
      # The named gate jobs below still report a red gate within ~30 s.
      - name: Static gates (blocking, started in the background)
        id: gates
        env:
          # CCN pins may only shrink vs this commit (#2210); empty -> merge-base with origin/main.
          IMP_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Runs next to the build: cuobjdump on a half-linked libimp.a reported 50 kernels gone
          # (run 39418394757). The "Kernel resources" step below reads the finished artifact.
          IMP_GATE_SKIP: kernels
        run: |
          # Every stream detached, or the step's `docker exec` waits for the child.
          # `|| rc=$?`: under `sh -e` a bare failing gate would end the subshell before the rc write.
          ( rc=0; bash scripts/ci_static_gates.sh > "$RUNNER_TEMP/gates.log" 2>&1 || rc=$?; echo "$rc" > "$RUNNER_TEMP/gates.rc" ) \
            < /dev/null > /dev/null 2>&1 &

      - name: Verify nvcc version
        if: steps.changes.outputs.code == 'true'
        run: |
          nvcc --version
          nvcc --version | grep -q "release ${CUDA_VERSION}" \
            || { echo "::error::nvcc is not CUDA ${CUDA_VERSION} (the image toolchain)"; exit 1; }

      # ccache caches per-TU compile output by content hash. On a header
      # change that invalidates many TUs (typical refactor), ccache hits
      # on the TUs whose post-preprocessor content didn't actually change —
      # saves the slow nvcc ptxas pass for sm_120a.
      # restore + explicit "Save ccache" at the end: the save (median 27 s) is
      # skipped when the build missed nothing, 6 of 38 green PR Builds before.
      - name: Restore ccache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.ccache
          key: ${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-ccache-

      - name: Reset ccache stats
        if: steps.changes.outputs.code == 'true'
        run: |
          ccache --version
          ccache -p | head -20 || true
          ccache -z

      # Build cache: FetchContent _deps clones + CMake config state. ccache
      # handles object files separately. Restore-keys fall back to older
      # caches when src changes; ninja then incrementally rebuilds and
      # ccache provides per-TU hits even when the build cache misses.
      # Saved on push to main only; PRs restore (main's entry via restore-keys).
      # The post-step save cost ~27 s of the required Build check on every PR run.
      - name: Cache build directory
        if: steps.changes.outputs.code == 'true' && github.event_name == 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-${{ hashFiles('tests/**') }}
          restore-keys: |
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-
      - name: Restore build directory (no save)
        if: steps.changes.outputs.code == 'true' && github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-${{ hashFiles('tests/**') }}
          restore-keys: |
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-

      - name: Configure
        if: steps.changes.outputs.code == 'true'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMP_BUILD_TESTS=ON \
            -DIMP_BUILD_TOOLS=ON \
            -DIMP_BUILD_BENCH=OFF \
            -DIMP_DISABLE_120F_FALLBACK=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DCMAKE_CUDA_COMPILER_LAUNCHER=sh;$PWD/scripts/ci_compile_slot.sh;ccache"
          # CMakeLists.txt pins arch=compute_120a,code=sm_120a directly via
          # gencode and sets CMAKE_CUDA_ARCHITECTURES=OFF. IMP_DISABLE_120F_FALLBACK=ON
          # builds the sm_120a SASS only (no compute_120f PTX fallback) — CI just
          # verifies the build compiles + CPU tests; runtime tests need a self-hosted
          # RTX 5090 runner. Measured over the three heaviest TUs on the dev
          # toolchain, the second gencode costs +53.1% device-compile time
          # (47278 ms with it, 30886 ms without), and it stops every .cu
          # diagnostic from being emitted twice (once per gencode). The shipped
          # fatbin carries no 120f PTX either since C-012 (sm_120a only); the opt-in
          # build is what the `PTX fallback` job below assembles (#1650).
          # IMP_BUILD_BENCH=OFF skips imp-bench here; the step "Build imp-bench
          # (nightly)" below compiles it on schedule and dispatch. The mxf4nvf4 probe/microbench TUs
          # build with the tests (imp_test_kernels), never into libimp.

      - name: Build
        if: steps.changes.outputs.code == 'true'
        # -j$(nproc): scripts/ci_compile_slot.sh (CUDA launcher above) keeps the five
        # 5-8.6 GB CUTLASS TUs to <= 2 at once (12.7 GB worst pair); build_jobs.sh caps
        # the runner at -j2. memory.peak is the container cgroup high-water mark.
        run: |
          cmake --build build -j"$(nproc)"
          echo "nproc=$(nproc) cgroup memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) B"

      # Per-kernel registers and local frame against the pin (#1549). Runs HERE
      # because this is the one place both halves exist: the built artifact and
      # the CUDA toolkit that carries cuobjdump. It reads the compiled library,
      # so it needs no GPU - which is what makes a register-pressure gate
      # possible in CI at all, where every throughput gate is impossible.
      - name: Kernel resources
        if: steps.changes.outputs.code == 'true'
        # libimp_test_kernels.a: the test-only probe/bench kernels (IMP_BUILD_TESTS=ON here).
        run: |
          { cuobjdump -res-usage build/libimp.a; cuobjdump -res-usage build/libimp_test_kernels.a; } \
            | python3 tools/kernel_resources.py -

      - name: ccache stats
        id: ccstats
        if: steps.changes.outputs.code == 'true'
        run: |
          ccache -s | tee "$RUNNER_TEMP/ccache-stats.txt"
          # Fail-open: an unparsable count saves.
          misses="$(awk '/^ *Misses:/ {print $2; exit}' "$RUNNER_TEMP/ccache-stats.txt")"
          echo "misses=${misses:-unknown}" >> "$GITHUB_OUTPUT"
          # A PR saves from 30 misses on (a re-push recompiles less than that in under 90 s);
          # main saves on any miss: its entry is the one every PR restores.
          save=true
          case "${misses:-unknown}" in
            *[!0-9]*) ;;
            0) save=false ;;
            *) [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$misses" -ge 30 ] || save=false ;;
          esac
          echo "save=$save" >> "$GITHUB_OUTPUT"

      # Stage 2 (CI / CPU): run every CPU-runnable GTest. The `unit` ctest label
      # (unit_core, unit_text, the CPU subset of test-e2e, guard_e2e_lane_split)
      # needs no GPU and no model — it is the half of the suite that CAN run here.
      # GPU correctness lives in the local pre-commit hook (Stage 1), since this
      # CUDA build container has no device. Before this step CI built the CPU
      # tests but never ran them (only mock-api did), so e.g. the tool-call and
      # Bearer-auth unit tests were dark.
      - name: Run CPU unit tests (ctest -L unit)
        if: steps.changes.outputs.code == 'true'
        # -j4: guard_verify_filter (11.8 s) and guard_makefile_filters (11.1 s) were
        # 23 of 27 s serial; both only list gtests and write per-PID temp files.
        run: cd build && ctest -L unit -j4 --output-on-failure --timeout 120

      # imp-bench (tools/imp-bench, 5 sources) is in no pull-request build
      # (IMP_BUILD_BENCH=OFF above and in the `ci` preset), so a breakage showed
      # only when someone measured (AUDIT_ARCH_2026_11_24 X-10). Nightly and on
      # demand: same build/ and flags, only the option flips, only that target builds.
      - name: Build imp-bench (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cmake -B build -DIMP_BUILD_BENCH=ON
          cmake --build build --target imp-bench -j"$(nproc)"

      # clang-tidy, BLOCKING since 2026-11-25 (AUDIT_ARCH_2026_11_24 X-2): as its own
      # non-required job it was red on main on 3 consecutive pushes (runs 45259686168,
      # 45259954018, 45270975645) and each merged. Here because the ruleset requires
      # the one context `Build`. Lints only the changed src|tools .cpp and the host
      # side of changed src .cu (clang `-x cuda --cuda-host-only`, #2210) against this
      # job's own build/ (compile_commands.json, _deps, generated headers).
      # Cost over 8 PR runs of the former job: install 8-11 s + lint 9-37 s, median
      # 30 s, against a median 327 s `Build` on the 12 PR runs that linted.
      # Device code has no automated lane (docs/audit/SETTLED.md F-5, F2-7).
      # Pin, key fingerprint: scripts/install_llvm.sh. The CUDA apt source goes first:
      # its index shipped malformed on 2026-09-16 and the script runs apt-get update.
      - name: Install clang-tidy
        if: steps.changes.outputs.cpp == 'true' && steps.changes.outputs.code == 'true'
        run: |
          rm -f /etc/apt/sources.list.d/cuda*.list
          bash scripts/install_llvm.sh clang-tidy

      # Hard (#2210): scripts/tidy_lane.sh fails on a clang-tidy nonzero exit, on a .cu with
      # a clang error (#2219's first run: 89 of 89, response-file includes lost) and on a
      # WarningsAsErrors finding (.clang-tidy: bugprone-*, clang-analyzer-*) over its pin in
      # tools/tidy_baseline.toml. Other checks print only. Full lane locally: `make tidy`;
      # changed files only: `make preflight`.
      - name: clang-tidy (blocking, changed .cpp + .cu host side)
        if: steps.changes.outputs.cpp == 'true' && steps.changes.outputs.code == 'true'
        # This job's default is `sh -e`: `mapfile` and `< <(...)` fail there (#2187).
        shell: bash
        env:
          TIDY_LOGS: ${{ runner.temp }}/tidy
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          # `|| true` on the whole pipeline made "git failed" and "no .cpp changed"
          # the same outcome (#1626): fail the diff loudly, keep the empty list quiet.
          if ! diff_out="$(git diff --name-only --diff-filter=d "$base" HEAD)"; then
            echo "::error::git diff failed against base $base: the lint list would be empty"
            exit 1
          fi
          mapfile -t files < <(printf '%s\n' "$diff_out" | grep -E '^(src|tools)/.*\.cpp$|^src/.*\.cu$' || true)
          if [ "${#files[@]}" -eq 0 ]; then echo "no src/tools .cpp or src .cu changed: nothing to lint"; exit 0; fi
          echo "linting ${#files[@]} changed file(s) (a fragment lints its includer):"; printf '  %s\n' "${files[@]}"
          bash scripts/tidy_lane.sh "${files[@]}"

      # Joins the background gate run; its exit code is this step's. Runs after a
      # failed compile too, so a red gate is never hidden behind a red build.
      - name: Static gates (result)
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        run: |
          i=0
          while [ ! -f "$RUNNER_TEMP/gates.rc" ]; do
            i=$((i + 1))
            [ "$i" -le 900 ] || { echo "::error::static gates did not finish in 900 s"; cat "$RUNNER_TEMP/gates.log" 2>/dev/null; exit 1; }
            sleep 1
          done
          cat "$RUNNER_TEMP/gates.log"
          rc="$(cat "$RUNNER_TEMP/gates.rc")"
          [ "$rc" = 0 ] || echo "::error::scripts/ci_static_gates.sh exited $rc"
          exit "$rc"

      # 68 of 83 PR Builds saved (median 20 s, 765 MB each) with the repo cache at 10.8 of 10 GB;
      # 45 of the 83 compiled for under 90 s.
      - name: Save ccache
        if: steps.changes.outputs.code == 'true' && steps.ccstats.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.ccache
          key: ${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-ccache-${{ github.sha }}

      # `Real API contract` reads imp-server only.
      - name: Upload imp-server
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imp-build
          path: build/imp-server

  # CPU-only API contract check (R3 / P2.6). The Python mock suite in tests/api/
  # exercises the HTTP schema, SSE envelope, error bodies and lifecycle against
  # the in-process mock_server.py — no GPU, no model, no CUDA toolchain. It was
  # the cheapest CI-able coverage in the test audit but ran only manually
  # (run_mock_tests.sh). Separate ubuntu job so it stays independent of the slow
  # CUDA Build job; "not perf and not tools" deselects the real-model markers.
  # NOTE: do NOT rename the `build` job's `name: Build` — a branch ruleset
  # requires that exact check name.
  mock-api:
    name: Mock API contract
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r tests/api/requirements.txt

      - name: Run mock API suite
        env:
          IMP_USE_MOCK: "1"
        run: python -m pytest tests/api -m "not perf and not tools" --tb=short -q

  # Real-server API contract (#1302). `Mock API contract` above validates
  # mock_server.py; this job runs the SHIPPING binary. imp-server started
  # without --model answers its whole request-validation surface — parameter
  # bounds, error envelopes, /health, /v1/models, /metrics, unmatched routes —
  # before it ever looks for weights, so none of it needs a GPU. Tests that
  # need generated tokens are the ones NOT marked `nomodel`; they stay in the
  # local `make test-server` lane.
  #
  # ubuntu:26.04 (GLIBC_2.43; the 24.04 runner cannot load the binary) + cudart/cuBLAS wheels,
  # not nvidia/cuda devel (4353 MB, 62 s init of a 92 s median job). ldd imp-server needs
  # only libcudart.so.13, libcublas.so.13, libcublasLt.so.13 and libjpeg.so.8 (#2381) beyond libc/libstdc++.
  real-api:
    name: Real API contract (model-less)
    needs: build
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ubuntu@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d # 26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imp-build
          path: build

      - name: Install python and the CUDA runtime libs
        run: |
          ok=0
          for m in azure.archive.ubuntu.com archive.ubuntu.com mirrors.edge.kernel.org; do
            sed -i -E "s#http://[a-z.]+/ubuntu/?#http://$m/ubuntu/#" /etc/apt/sources.list.d/ubuntu.sources
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3 python3-venv curl ca-certificates libjpeg-turbo8 \
              && { ok=1; break; }
            echo "::warning::apt via $m failed, trying the next mirror"
          done
          [ "$ok" = 1 ]
          # Toolkit versions = the build image (13.5.0): cudart 13.5.37, cuBLAS 13.10.0.20 (444 MB).
          # Fetched in the background while pip runs; sha256-verified (H-6).
          mkdir -p /tmp/cuda-whl
          curl -fsSL https://files.pythonhosted.org/packages/0b/7c/14b8f5518f8951e9dca57ea80f44f8ea8bcc8671812e6cc38009f3205e57/nvidia_cuda_runtime-13.5.37-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl -o /tmp/cuda-whl/cudart.whl
          curl -fsSL -w 'cublas wheel: %{size_download} B in %{time_total} s\n' https://files.pythonhosted.org/packages/b4/12/16628161ed8c109c8c73b38167df50cbc630a8a6e6548e2534d461526c3c/nvidia_cublas-13.10.0.20-py3-none-manylinux1_x86_64.manylinux_2_5_x86_64.whl -o /tmp/cuda-whl/cublas.whl &
          fetch=$!
          # A venv rather than --break-system-packages: the lock file pins the
          # whole transitive set, and pip cannot replace Debian's own copy of
          # one of them in place (no RECORD file) (AUDIT_ARCH_2026 H-6).
          python3 -m venv /tmp/api-venv
          /tmp/api-venv/bin/pip install -q -r tests/api/requirements.txt
          wait "$fetch"
          echo 'df2b79a8852f10d1fef8c848489c49eebb5754051bf870202a862831412b179d  /tmp/cuda-whl/cudart.whl' | sha256sum -c -
          echo 'dcc6d63884c53d07e267ce7e6feac17b2538cebaafec5db865736c3e28e4dc84  /tmp/cuda-whl/cublas.whl' | sha256sum -c -
          python3 -m zipfile -e /tmp/cuda-whl/cudart.whl /tmp/cuda-libs
          python3 -m zipfile -e /tmp/cuda-whl/cublas.whl /tmp/cuda-libs
          echo "LD_LIBRARY_PATH=/tmp/cuda-libs/nvidia/cu13/lib" >> "$GITHUB_ENV"
          echo "/tmp/api-venv/bin" >> "$GITHUB_PATH"

      - name: Run the API contract against imp-server
        run: |
          chmod +x build/imp-server
          # A missing .so fails here, named, instead of as a pytest startup timeout.
          if ldd build/imp-server | grep 'not found'; then exit 1; fi
          # conftest.py starts it model-less and shuts it down at session end.
          IMP_SERVER_BIN="$PWD/build/imp-server" \
            python3 -m pytest tests/api -m nomodel --tb=short -q

      # What this job does NOT cover, printed rather than implied (#1600).
      # Generation needs a GPU and CI has no GPU runner, so every test that
      # produces a token is deselected here. The job name says "model-less" for
      # the same reason: "Real API contract" green next to a streaming defect
      # reads as coverage.
      - name: State the uncovered half
        run: |
          total=$(python3 -m pytest tests/api --collect-only -q 2>/dev/null | tail -1)
          covered=$(python3 -m pytest tests/api -m nomodel --collect-only -q 2>/dev/null | tail -1)
          echo "collected here:  $covered"
          echo "collected total: $total"
          echo ""
          echo "The difference is the generation contract: SSE frame structure, usage"
          echo "accounting, finish_reason, tool-call streaming. It runs in 'make test-server'"
          echo "on a machine with a GPU and in no CI job. See docs/LIMITATIONS.md."

  # Format check (CI1). clang-format on CHANGED LINES only (git clang-format).
  # ADVISORY: it surfaces the diff but does not fail the job — the repo is not
  # clang-format-clean, so a rename or edit that merely TOUCHES a wrap-sensitive
  # line gets re-wrapped by clang-format and would red-X otherwise (whole CUDA
  # files are never reformatted, see CLAUDE.md). Flip back to a hard `exit 1`
  # after a repo-wide format normalization. clang-tidy (the Build job) is advisory
  # for the same reason.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install clang-format
        # Host runner: root via sudo. Pin, key fingerprint: scripts/install_llvm.sh (ships git-clang-format).
        run: sudo bash scripts/install_llvm.sh clang-format
      - name: clang-format (changed lines)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "diff base: $base"
          diff="$(git clang-format --style=file --diff "$base" 2>/dev/null || true)"
          if [ -z "$diff" ] || echo "$diff" | grep -qiE 'did not modify|no modified files'; then
            echo "format clean on changed lines"; exit 0
          fi
          echo "$diff"
          echo "::warning::clang-format would change the above changed lines — run 'make format' (advisory, not blocking)"
          exit 0
      # Dependency pins. BLOCKING, and deliberately here rather than in the CUDA
      # Build job: Build restores a Docker layer cache, which is exactly what
      # hides a broken pin. On 2026-08-14 the CUTLASS pin read `4.7.0` while the
      # tag upstream is `v4.7.0`, so every build from a cold cache failed while
      # cached ones stayed green; three of the four Dockerfile ARG defaults had
      # also drifted behind the pins they mirror.
      - name: Dependency pins (drift + upstream tags)
        run: bash scripts/check_dep_pins.sh --online

  # File-size gate (recompile blast-radius smell). Own ubuntu job — independent of
  # the slow CUDA Build, needs no toolchain, just Python 3.11+ for tomllib. Two
  # steps by design: an ADVISORY warn display (never fails) and a BLOCKING hard-
  # review gate (fails only on a NON-allowlisted file over its hard threshold).
  # Thresholds + allowlist live in tools/filesize_thresholds.toml; baseline state
  # is documented in docs/audit/AUDIT_FILESIZE.md. See CLAUDE.md "File Layout & Size".
  filesize:
    name: File size
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the CCN pin ratchet reads the base commit's baseline (#2210)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: File-size smells (advisory, non-blocking)
        run: python3 tools/check_filesize.py --warn-only
      # The blocking checks live in scripts/ci_static_gates.sh, which the `Build`
      # job also runs so a red gate fails the one required context. This job
      # keeps them a named check: "which gate failed" is worth a check name, and
      # the filter means there is one list rather than two that drift.
      - name: File-size gates (blocking)
        env:
          IMP_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci_static_gates.sh filesize

  # Test-lane gate (tools/check_test_lanes.py): every test in a ctest lane, no unit-lane test
  # demoted vs the merge-base. Own check name: inside "File size" its reds misread (2026-08-25).
  testlanes:
    name: Test lanes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the unit-lane demotion check reads the merge-base with origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test-lane gate (blocking)
        run: bash scripts/ci_static_gates.sh lanes

  # Documentation layer contract (docs/audit/docs-rewrite/). Seven checks, all
  # of which map to a defect this repo actually shipped: a datacenter-Blackwell
  # feature named as an imp feature, a throughput number that outlived its
  # measurement, a generated block hand-edited away from the baseline it claims
  # to mirror. Ubuntu job, no toolchain, seconds.
  docs:
    name: Docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # docs_lint.py reads git history for the L3 verified/commit headers
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Doc gates (blocking)
        run: bash scripts/ci_static_gates.sh docs

  hygiene:
    name: Release hygiene
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release hygiene gate (blocking)
        run: bash scripts/ci_static_gates.sh hygiene

  alloc-sites:
    name: Alloc sites
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Alloc-site gates (blocking)
        run: bash scripts/ci_static_gates.sh alloc

  launchguards:
    name: Launch guards
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Launch-guard gate (blocking)
        run: bash scripts/ci_static_gates.sh launchguards

  # Assemble the compute_120f PTX fallback (#1650).
  #
  # Opt-in since C-012 (IMP_DISABLE_120F_FALLBACK=OFF). It is `code=compute_120f`, the PTX-only form, so ptxas never runs over
  # it in a build and the first thing that would is the driver's JIT on a cc 12.1 GB10
  # - a card nobody in this project owns. Assembling it needs no GPU: ptxas is a
  # compiler.
  #
  # This has to be its own job because the `Build` job configures
  # IMP_DISABLE_120F_FALLBACK=ON: that binary carries no PTX at all, so the
  # check there measured nothing it could measure and failed the one required
  # context on a build doing exactly what it was told.
  #
  # It builds the `imp` static library only - no tools, no server, no tests, no
  # device link. cuobjdump reads the archive. Measured on the dev toolchain over
  # the three heaviest TUs, the second gencode costs +53.1% device-compile time
  # (47278 ms vs 30886 ms), which is why this is a separate non-required job
  # rather than a flag flip on the required one.
  ptx-fallback:
    name: PTX fallback
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kekzl/imp-ci:cuda13.5@sha256:d9b67d58c7af2a54e70cf1a996d8c5381f90661f2629ab36abaa639615f24e5c
    defaults:
      run:
        shell: bash
    env:
      CUDA_VERSION: "13.5"
      CCACHE_DIR: /github/home/.ccache-ptx
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust the checkout (container UID differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Only device code, the gencode lines and this guard itself can change
      # what ptxas sees. Fail-open: an unreadable diff runs the job.
      - name: Does this run need the fallback build?
        id: scope
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$base" HEAD)"
              if ! grep -qE '(\.cu$|\.cuh$|^CMakeLists\.txt$|^cmake/|^scripts/check_ptx_fallback\.sh$|^\.github/workflows/ci\.yml$)' <<< "$files"; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "fallback build: run=$run"

      - name: Restore ccache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.ccache-ptx
          key: ${{ runner.os }}-cuda13.5-ccache-ptx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cuda13.5-ccache-ptx-

      # The fallback is opt-in since C-012 (default ON = no PTX): this job keeps
      # the opt-in build (OFF) assembling.
      - name: Configure with the fallback on
        if: steps.scope.outputs.run == 'true'
        run: |
          cmake -B build-ptx \
            -DIMP_DISABLE_120F_FALLBACK=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMP_BUILD_TESTS=OFF \
            -DIMP_BUILD_TOOLS=OFF \
            -DIMP_BUILD_SERVER=OFF \
            -DIMP_BUILD_BENCH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build the device library
        if: steps.scope.outputs.run == 'true'
        run: cmake --build build-ptx --target imp -j"$(bash scripts/build_jobs.sh)"

      - name: Assemble every PTX image
        if: steps.scope.outputs.run == 'true'
        run: bash scripts/check_ptx_fallback.sh build-ptx/libimp.a

  # ASan + UBSan over the CPU test binaries, including the fuzz corpus (#1621).
  #
  # Before this job no CI lane ran any sanitizer in any category: ASAN/UBSAN
  # existed behind a manual `make asan`, the one job that mentions
  # compute-sanitizer is gated on a GPU runner the owner decided against, and
  # its memcheck step is `continue-on-error` anyway.
  #
  # It is what makes the fuzz corpus worth running. Measured against the four
  # reverted parser fixes, per target:
  #
  #             without ASan      with ASan
  #   schema    green             stack-overflow
  #   regex     hang              hang
  #   gbnf      SEGV              stack-overflow
  #   tokenizer hang              heap-use-after-free
  #
  # An out-of-bounds read is invisible without it: the process reads a
  # neighbouring allocation and carries on.
  #
  # PR runs are gated on the parser/loader paths so the CUDA build is not paid
  # on every PR; nightly and workflow_dispatch always run it. Advisory in
  # practice like every job except `Build` (ruleset 14716423 requires that one
  # context) - so read it after a merge, not only before.
  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kekzl/imp-ci:cuda13.5@sha256:d9b67d58c7af2a54e70cf1a996d8c5381f90661f2629ab36abaa639615f24e5c
    # Own ccache namespace: these objects are RelWithDebInfo + ASan/UBSan host
    # flags, so nothing here is shareable with the `Build` (Release) or
    # `PTX fallback` stores and a shared dir would only evict theirs.
    env:
      CCACHE_DIR: /github/home/.ccache-asan
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
    # Without this GitHub picks `sh -e {0}` and any bashism is a syntax error at step start
    # (the first version died on a here-string in 1m15s and merged: `Build` is the only required check).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Without it `git cat-file` exits 128 (dubious ownership), the scope below
      # falls open and run=true on every PR: 69/69 ran, 31 matched the list.
      - name: Trust the checkout (container UID differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Does this run need the sanitizer build?
        id: scope
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$base" HEAD)"
              # The prefixes live in tools/untrusted_input_sources.txt; the static
              # gate `untrusted` (scripts/ci_static_gates.sh, inside `Build`) fails
              # when a fuzz source or a file tagged "Untrusted input" has none. As
              # a regex on this line the list missed 4 parser files
              # (AUDIT_ARCH_2026_11_24 X-5). It is the untrusted-input surface,
              # not only the files with a fuzz target (AUDIT_ARCH_2026 F2-8).
              # Fail-open: only exit 1 (no path matched) skips; an unreadable diff
              # or a tool error runs the job. Here-string: no producer to take
              # EPIPE under pipefail (#1499).
              rc=0
              python3 tools/check_untrusted_sources.py --match <<< "$files" || rc=$?
              [ "$rc" -ne 1 ] || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sanitizer build: run=$run"

      # This lane rebuilt every TU from scratch on every run: 19 min median over
      # the last 8 PR runs, which WAS the wall clock of the whole workflow (the
      # `Build` job's median is 6 min). It is the same store shape the
      # `PTX fallback` lane already uses.
      # Saved on push to main only: each PR save was 490-701 MB with the repo cache
      # at 10.50 of 10 GB, evicting main's entries. PRs restore main's store.
      - name: Restore ccache
        if: steps.scope.outputs.run == 'true' && github.event_name == 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.ccache-asan
          key: ${{ runner.os }}-cuda13.5-ccache-asan-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cuda13.5-ccache-asan-
      - name: Restore ccache (no save)
        if: steps.scope.outputs.run == 'true' && github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.ccache-asan
          key: ${{ runner.os }}-cuda13.5-ccache-asan-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cuda13.5-ccache-asan-

      - name: Fetch pinned deps
        if: steps.scope.outputs.run == 'true'
        run: |
          # Two separate traps, both hit on the way here. The pin line is
          #   set(IMP_DEP_GOOGLETEST_SHA    063de7e9...  CACHE STRING "...")
          # with RUN-LENGTH whitespace, so a pattern with one space matches
          # nothing, grep exits 1 and `-e` kills the step with no message at
          # all. And `grep | head -1` under `-o pipefail` is #1499: head closes
          # the pipe, grep dies of EPIPE, the pipeline is non-zero even on a
          # hit. `\s+` fixes the first, `-m1` instead of a pipe the second.
          # By commit, not by tag: same pin as the Dockerfile (H-8).
          GT="$(grep -m1 -oP 'IMP_DEP_GOOGLETEST_SHA\s+\K[^ )]+' cmake/imp-deps.cmake)"
          test -n "$GT" || { echo "googletest pin not found in cmake/imp-deps.cmake"; exit 1; }
          echo "googletest pin: $GT"
          mkdir -p /deps/googletest
          git -C /deps/googletest init -q
          git -C /deps/googletest fetch -q --depth=1 https://github.com/google/googletest.git "$GT"
          git -C /deps/googletest checkout -q FETCH_HEAD

      # No tools, no bench, no server: the same configuration `make asan` uses,
      # which is also why the five unconditional fuzz targets must not live in
      # the IMP_BUILD_SERVER block - the first version of them did, and the
      # sanitizer binary silently contained none of them (0 tests, "PASSED").
      - name: Build test-core + test-text with ASan/UBSan
        if: steps.scope.outputs.run == 'true'
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DIMP_SANITIZERS=ON \
            -DIMP_BUILD_TOOLS=OFF -DIMP_BUILD_BENCH=OFF -DIMP_BUILD_SERVER=OFF \
            -DIMP_DISABLE_120F_FALLBACK=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=/deps/googletest
          # IMP_DISABLE_120F_FALLBACK=ON: the option defaults OFF, so this lane
          # was emitting the compute_120f PTX entry as well as the sm_120a SASS.
          # The `Build` job measured the second gencode at +53.1% device-compile
          # time, and this lane can use neither image - the runner has no GPU and
          # CMakeLists.txt does not sanitize device code ("CUDA code is NOT
          # sanitized"). The fatbin that ships is assembled and checked by the
          # `PTX fallback` job, which deliberately leaves the option at OFF.
          ccache -z
          cmake --build build-asan --target test-core test-text -j"$(bash scripts/build_jobs.sh)"
          ccache -s

      # A binary that contains none of the tests reports "PASSED 0 tests" and
      # exits 0. That is how the first version of this job would have gone green
      # without running anything.
      # test-core links libcuda.so.1 and this runner has no driver, so the
      # binary does not start: `error while loading shared libraries`. The CUDA
      # image ships a stub for exactly this, under the name the linker wants but
      # not the one the loader wants (libcuda.so, not .so.1) - hence the symlink.
      # CUDA calls then fail at runtime, which is what the CPU lane expects
      # anyway: those tests skip.
      #
      # Found only after making the assert print stderr. My first guess was the
      # known ASan-vs-high-ASLR crash on Ubuntu 24.04; it was not that.
      - name: CUDA driver stub (no GPU on this runner)
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cudastub"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cudastub/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cudastub" >> "$GITHUB_ENV"

      - name: Assert the fuzz corpus is in the binary
        if: steps.scope.outputs.run == 'true'
        run: |
          # `2>/dev/null` here hid WHY on the first red run: an ASan binary that
          # cannot start prints to stderr and lists nothing, which reads
          # identical to a binary built without the tests. Keep stderr.
          ./build-asan/test-core --gtest_list_tests > /tmp/tests.txt
          if ! grep -q '^FuzzCorpus' /tmp/tests.txt; then
            echo "FuzzCorpus missing from the sanitizer binary."
            echo "suites it does have:"
            grep -E '^[A-Za-z]' /tmp/tests.txt | head -40
            exit 1
          fi

      # GPU-less, the flags `make asan` uses; the pass/skip counts are in each
      # binary's own summary (a number here went stale with #1861 unnoticed).
      # FuzzCorpus.Regex is 11 s of that under ASan against 0.5 s without - the
      # NFA compiler over 1500 mutations is what the sanitizer slows down.
      - name: Run
        if: steps.scope.outputs.run == 'true'
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=tools/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=tools/sanitizers/ubsan.supp
        run: |
          ./build-asan/test-core
          ./build-asan/test-text

  # Coverage-guided fuzzing, nightly (AUDIT_ARCH_2026 F2-6). The CPU lane
  # replays 1500 fixed-seed iterations per target and can only re-find a known
  # defect class; libFuzzer with coverage feedback is what finds a new one, and
  # nothing ran it unless someone typed the docker line in fuzz/README.md. The
  # four parser targets, 10 minutes each, corpus carried between nights in
  # the cache, crashers in the run's artifacts. Advisory: a crasher is a
  # warning here and an issue for a human. fuzz_tool_stream is not here: it
  # needs tool_call.cpp, whose utils.h pulls httplib and whose utils.cpp pulls
  # imp/imp.h: the chain ends at the engine, so a CPU-only build of it is a
  # header split across 17 translation units, not a link line (measured
  # 2026-09-10, abandoned). The CPU lane runs its target function on every PR.
  fuzz-nightly:
    name: Fuzz (nightly, libFuzzer)
    # workflow_dispatch too: schedule-only is why two nights of a job that
    # configured nothing went unnoticed, since there was no way to run it
    # against a branch before it landed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # Ubuntu 26.04 for its libstdc++: the tree's C++23 does not compile against
    # the libstdc++ 12 that silkeh/clang:18 ships (std::ranges over string_view),
    # and that image had no ninja and no nvcc either, so this job configured
    # nothing and fuzzed nothing from its first night (2026-09-08) on.
    container:
      image: ubuntu@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d # 26.04
    steps:
      - name: Toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build git ca-certificates libcurl4-openssl-dev libjpeg-turbo8-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "clang + libFuzzer (pin: scripts/install_llvm.sh)"
        run: bash scripts/install_llvm.sh clang libclang-rt

      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build the parser targets
        run: |
          cmake -B build-fuzz -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DIMP_FUZZERS_CPU_ONLY=ON
          cmake --build build-fuzz -j"$(nproc)" \
                --target fuzz_wav fuzz_json_schema fuzz_regex fuzz_gbnf

      - name: Fuzz each target for 10 minutes
        run: |
          mkdir -p fuzz/crashes
          for t in fuzz_wav fuzz_json_schema fuzz_regex fuzz_gbnf; do
            mkdir -p "fuzz/corpus/$t"
            echo "== $t =="
            ./build-fuzz/$t -max_total_time=600 -artifact_prefix="fuzz/crashes/$t-" "fuzz/corpus/$t" \
              || echo "::warning::$t found a crasher (see the fuzz-crashes artifact)"
          done

      - name: Keep the crashers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/crashes
          if-no-files-found: ignore
