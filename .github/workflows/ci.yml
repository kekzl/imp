name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (CUDA ${{ matrix.cuda }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cuda: ['13.2']
        build_type: [Release]

    container:
      image: nvidia/cuda:${{ matrix.cuda }}.0-devel-ubuntu24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake g++ git python3

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DIMP_BUILD_TESTS=ON \
            -DIMP_BUILD_TOOLS=ON \
            -DIMP_BUILD_BENCH=ON
          # CMakeLists.txt pins arch=compute_120f,code=sm_120 directly via
          # gencode and sets CMAKE_CUDA_ARCHITECTURES=OFF. CI compiles PTX/SASS
          # for sm_120 only; runtime tests need a self-hosted RTX 5090 runner.

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: imp-build
          path: |
            build/imp-cli
            build/imp-bench
            build/imp-tests
            build/test-core
            build/test-text
            build/test-compute
            build/test-attention
            build/test-quant
            build/test-kv
            build/test-moe-gdn
            build/test-e2e
            build/libimp.a

  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04
    # GPU tests require self-hosted runner with NVIDIA GPU.
    # Uncomment the line below and remove ubuntu-24.04 when a GPU runner is available.
    # runs-on: [self-hosted, gpu, cuda]
    if: false  # Skip until GPU runner is configured

    steps:
      - uses: actions/checkout@v5

      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: imp-build
          path: build/

      - name: Run tests
        run: |
          chmod +x build/imp-tests
          cd build && ctest --output-on-failure
