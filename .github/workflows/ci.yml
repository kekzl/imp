name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run CI against a ref on demand: `gh workflow run CI --ref main`.
  #
  # Needed because a squash merge performed by AUTO-MERGE does not start a
  # workflow run. The merge is attributed to GITHUB_TOKEN (auto-merge.yml arms
  # it with that token), and events created by GITHUB_TOKEN do not trigger
  # further runs — GitHub's loop prevention. A merge a human clicks does fire.
  # So `main`'s newest CI run can be many commits old and show a state that has
  # since been fixed: on 2026-08-01 it still displayed seven warnings that main
  # no longer had. Coverage is not lost (the PR run builds the tree that gets
  # squashed), but the branch's reported status is stale, and this makes it
  # refreshable without a PAT or a merge queue.
  workflow_dispatch:
  # Nightly, 03:17 UTC.
  #
  # NOTE (2026-08-03): the repo owner has decided against a self-hosted GPU
  # runner for now, so the `test` job below stays skipped and this schedule
  # currently buys only reason 2. Reason 1 is kept because the job is written
  # and the decision is reversible — if a runner is ever registered, the lane
  # starts covering `main` on its own cadence with no further change here.
  #
  #  1. The GPU lane (`test`, below) is the only lane that runs the full ctest,
  #     compute-sanitizer and the perf gate. It is gated on a self-hosted runner,
  #     and a runner that only ever sees push/pull_request events tests whatever
  #     someone happened to open a PR for — never `main` on its own schedule.
  #  2. It refreshes `main`'s reported status, which the workflow_dispatch note
  #     above exists to work around by hand: an auto-merge squash does not start
  #     a run, so main's newest result can be many commits stale.
  #
  # Costs nothing while HAS_GPU_RUNNER is unset beyond one nightly CPU build.
  schedule:
    - cron: "17 3 * * *"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}

    container:
      # Native CUDA devel image: nvcc $CUDA_VERSION is on PATH at /usr/local/cuda
      # out of the box (matches the Dockerfile builder). No apt toolkit install.
      # Ubuntu 26.04 → GCC 15.2, so CI compiles on the same libstdc++ 15 as the
      # release image and catches missing-include regressions (#903) here.
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04

    env:
      # CUDA toolchain version — used by the verify step and cache keys. Kept in
      # sync with the container image tag above (bump both to move CI).
      CUDA_VERSION: "13.3"
      CCACHE_DIR: /github/home/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"

    steps:
      # Minimal git up front so checkout below pulls real history and the
      # docs-only detection can diff against the PR/push base. (The rest of the
      # build tooling installs later, gated on the detection result.)
      #
      # python3 comes with it because the static gates below are python and this
      # container has neither: `nvidia/cuda:13.3.1-devel-ubuntu26.04` ships no
      # python3 and no git. Without this the gate step fails "python3: not
      # found" on every PR, which is a false red on the one required check.
      - name: Install git and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the base SHA is present for `git diff`

      # Docs-only changes (only **/*.md or docs/** touched) skip the expensive
      # CUDA build/test below but still report the required `Build` check as
      # success — every heavy step is gated on steps.changes.outputs.code, so the
      # job goes green in seconds instead of pulling the multi-GB CUDA image,
      # configuring CUTLASS and linking. Plain `git diff` (no third-party action,
      # so no Node-deprecation churn). FAIL-OPEN: any uncertainty (no base SHA,
      # git error, empty diff) → code=true, so detection can never wrongly skip a
      # code change or leave the required check unreported.
      - name: Detect non-docs changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          code=true
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" HEAD)"
            # code stays true unless EVERY changed file is markdown or under docs/.
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf 'non-docs changes: code=%s\nchanged files:\n%s\n' "$code" "${files:-<none>}"

      # The blocking static gates, FIRST, before the compile. Ruleset 14716423
      # requires exactly one context (`Build`), so a gate that runs only as its
      # own job is advisory: #1523 merged with `File size` FAILED and #1524
      # merged over the same red gate forty minutes later (DEBT_LEDGER (j)).
      # Running them here is what makes red stop a merge. They are seconds, they
      # need no apt and no network, and putting them ahead of the build means a
      # drifted allowlist fails in ~15 s rather than after a three-minute
      # compile. The named jobs below still run the same script with a filter,
      # so `which gate failed` keeps a check name and there is one list, not two.
      # Runs on docs-only PRs too: the docs and release-hygiene gates are exactly
      # the ones a docs-only change can break.
      # git refuses this checkout on ownership inside the container: the
      # Actions runner owns /__w/imp/imp and the job's user does not. Without
      # this, any gate that shells out to git dies - check-release.sh:55 got an
      # empty `git rev-parse` and cd'd to nothing, which failed the required
      # check for a reason that had nothing to do with the tree.
      - name: Trust the checkout (container UID differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Static gates (blocking, before the build)
        run: bash scripts/ci_static_gates.sh

      - name: Install build deps
        if: steps.changes.outputs.code == 'true'
        # The native CUDA devel image already provides nvcc on PATH at
        # /usr/local/cuda; only the non-CUDA build tooling needs installing.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ git python3 ccache

      - name: Verify nvcc version
        if: steps.changes.outputs.code == 'true'
        run: |
          nvcc --version
          nvcc --version | grep -q "release ${CUDA_VERSION}" \
            || { echo "::error::nvcc is not CUDA ${CUDA_VERSION} (the image toolchain)"; exit 1; }

      # ccache caches per-TU compile output by content hash. On a header
      # change that invalidates many TUs (typical refactor), ccache hits
      # on the TUs whose post-preprocessor content didn't actually change —
      # saves the slow nvcc ptxas pass for sm_120a.
      - name: Restore ccache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: /github/home/.ccache
          key: ${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-ccache-

      - name: Reset ccache stats
        if: steps.changes.outputs.code == 'true'
        run: |
          ccache --version
          ccache -p | head -20 || true
          ccache -z

      # Build cache: FetchContent _deps clones + CMake config state. ccache
      # handles object files separately. Restore-keys fall back to older
      # caches when src changes; ninja then incrementally rebuilds and
      # ccache provides per-TU hits even when the build cache misses.
      - name: Cache build directory
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: build
          key: imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-${{ hashFiles('tests/**') }}
          restore-keys: |
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-

      - name: Configure
        if: steps.changes.outputs.code == 'true'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMP_BUILD_TESTS=ON \
            -DIMP_BUILD_TOOLS=ON \
            -DIMP_BUILD_BENCH=OFF \
            -DIMP_DISABLE_120F_FALLBACK=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          # CMakeLists.txt pins arch=compute_120a,code=sm_120a directly via
          # gencode and sets CMAKE_CUDA_ARCHITECTURES=OFF. IMP_DISABLE_120F_FALLBACK=ON
          # builds the sm_120a SASS only (no compute_120f PTX fallback) — CI just
          # verifies the build compiles + CPU tests; runtime tests need a self-hosted
          # RTX 5090 runner. This halves device-compile time and stops every .cu
          # diagnostic from being emitted twice (once per gencode). The shipped
          # fatbin (release-docker) keeps the 120f PTX fallback for 5080/5070 SKUs.
          # IMP_BUILD_BENCH=OFF skips ~30-60s of mxf4nvf4 microbench TUs that
          # are bench-only — production server builds don't link them.

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: cmake --build build -j$(nproc)

      - name: ccache stats
        if: steps.changes.outputs.code == 'true'
        run: ccache -s

      # Stage 2 (CI / CPU): run every CPU-runnable GTest. The `unit` ctest label
      # (unit_core, unit_text, the CPU subset of test-e2e, guard_e2e_lane_split)
      # needs no GPU and no model — it is the half of the suite that CAN run here.
      # GPU correctness lives in the local pre-commit hook (Stage 1), since this
      # CUDA build container has no device. Before this step CI built the CPU
      # tests but never ran them (only mock-api + the usually-absent self-hosted
      # GPU job did), so e.g. the tool-call and Bearer-auth unit tests were dark.
      - name: Run CPU unit tests (ctest -L unit)
        if: steps.changes.outputs.code == 'true'
        run: cd build && ctest -L unit --output-on-failure --timeout 120

      # clang-tidy moved OUT of this job into the separate non-required `tidy` job
      # below. It was ~22 min of this ~26 min job and — being advisory
      # (continue-on-error) — only delayed the merge-gating `Build` check without
      # ever failing it. The `tidy` job reuses this job's cached build/ for
      # compile_commands.json + _deps, lints only the PR's changed .cpp, and never
      # blocks merge.

      - name: Upload build artifacts
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: imp-build
          path: |
            build/imp-cli
            build/imp-server
            build/imp-tests
            build/test-core
            build/test-text
            build/test-compute
            build/test-attention
            build/test-quant
            build/test-kv
            build/test-moe-gdn
            build/test-e2e
            build/libimp.a

  # clang-tidy (advisory, NON-REQUIRED) — split out of the Build job so it never
  # delays the merge-gating `Build` check (it was ~22 min of that job). Reuses the
  # Build job's cached build/ (compile_commands.json + FetchContent _deps such as
  # CUTLASS) via the same cache key, so no second CUDA configure is needed. Lints
  # only the .cpp CHANGED in the PR — a normal PR is seconds; a big refactor is
  # bounded to its own files. Still .cpp-only (clang-tidy can't parse .cu without
  # the full nvcc flagset). Kernel (.cu) correctness is covered by the GPU tests +
  # compute-sanitizer (see the `test` job).
  tidy:
    name: clang-tidy
    needs: build
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04
    env:
      CUDA_VERSION: "13.3"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # base SHA must be present for the changed-files diff
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ git python3 clang-tidy
      - name: Restore build dir (compile_commands.json + _deps)
        uses: actions/cache@v6
        with:
          path: build
          key: imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-${{ hashFiles('tests/**') }}
          restore-keys: |
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ hashFiles('src/**', 'include/**', 'tools/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            imp-build-${{ runner.os }}-cuda${{ env.CUDA_VERSION }}-
      - name: clang-tidy (changed .cpp only, advisory)
        continue-on-error: true  # advisory — flip to a hard gate once baseline-clean
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          mapfile -t changed < <(git diff --name-only "$base" HEAD | grep -E '^(src|tools)/.*\.cpp$' || true)
          if [ ${#changed[@]} -eq 0 ]; then echo "no src/tools .cpp changed — nothing to lint"; exit 0; fi
          # compile_commands.json comes from the cached build/. If the cache missed
          # (cold key), reconfigure — _deps in the restored build/ keeps it cheap;
          # a fully cold _deps fetch is the rare worst case.
          if [ ! -f build/compile_commands.json ]; then
            echo "::warning::no cached compile_commands.json — reconfiguring"
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DIMP_BUILD_TESTS=ON \
              -DIMP_BUILD_TOOLS=ON -DIMP_BUILD_BENCH=OFF -DIMP_DISABLE_120F_FALLBACK=ON \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON >/dev/null
          fi
          echo "linting ${#changed[@]} changed .cpp:"; printf '  %s\n' "${changed[@]}"
          # Drop the per-TU progress + cumulative count lines (CUTLASS/CUDA headers
          # inflate the count into the hundreds of thousands); .clang-tidy's
          # HeaderFilterRegex already restricts displayed diagnostics to our code.
          clang-tidy -p build --warnings-as-errors= "${changed[@]}" 2>&1 \
            | grep -vE '^\[[0-9]+/[0-9]+\] Processing file|^[0-9]+ warnings generated\.$' || true

  # CPU-only API contract check (R3 / P2.6). The Python mock suite in tests/api/
  # exercises the HTTP schema, SSE envelope, error bodies and lifecycle against
  # the in-process mock_server.py — no GPU, no model, no CUDA toolchain. It was
  # the cheapest CI-able coverage in the test audit but ran only manually
  # (run_mock_tests.sh). Separate ubuntu job so it stays independent of the slow
  # CUDA Build job; "not perf and not tools" deselects the real-model markers.
  # NOTE: do NOT rename the `build` job's `name: Build` — a branch ruleset
  # requires that exact check name.
  mock-api:
    name: Mock API contract
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r tests/api/requirements.txt

      - name: Run mock API suite
        env:
          IMP_USE_MOCK: "1"
        run: python -m pytest tests/api -m "not perf and not tools" --tb=short -q

  # Real-server API contract (#1302). `Mock API contract` above validates
  # mock_server.py; this job runs the SHIPPING binary. imp-server started
  # without --model answers its whole request-validation surface — parameter
  # bounds, error envelopes, /health, /v1/models, /metrics, unmatched routes —
  # before it ever looks for weights, so none of it needs a GPU. Tests that
  # need generated tokens are the ones NOT marked `nomodel`; they stay in the
  # local `make test-server` lane.
  #
  # Runs in the same CUDA image the Build job compiled in: the binary is linked
  # against that libstdc++, so a plain ubuntu-24.04 runner cannot load it.
  real-api:
    name: Real API contract
    needs: build
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: imp-build
          path: build

      - name: Install python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          pip install --break-system-packages -r tests/api/requirements.txt

      - name: Run the API contract against imp-server
        run: |
          chmod +x build/imp-server
          # conftest.py starts it model-less and shuts it down at session end.
          IMP_SERVER_BIN="$PWD/build/imp-server" \
            python3 -m pytest tests/api -m nomodel --tb=short -q

  # Format check (CI1). clang-format on CHANGED LINES only (git clang-format).
  # ADVISORY: it surfaces the diff but does not fail the job — the repo is not
  # clang-format-clean, so a rename or edit that merely TOUCHES a wrap-sensitive
  # line gets re-wrapped by clang-format and would red-X otherwise (whole CUDA
  # files are never reformatted, see CLAUDE.md). Flip back to a hard `exit 1`
  # after a repo-wide format normalization. clang-tidy (the Build job) is advisory
  # for the same reason.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install clang-format
        # ubuntu-24.04 is a non-container host runner — apt and /usr/local/bin
        # need sudo (the CUDA Build job runs in a container as root, so it doesn't).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format git curl ca-certificates
          if ! command -v git-clang-format >/dev/null; then
            sudo curl -fsSL https://raw.githubusercontent.com/llvm/llvm-project/release/18.x/clang/tools/clang-format/git-clang-format \
              -o /usr/local/bin/git-clang-format && sudo chmod +x /usr/local/bin/git-clang-format
          fi
      - name: clang-format (changed lines)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "diff base: $base"
          diff="$(git clang-format --style=file --diff "$base" 2>/dev/null || true)"
          if [ -z "$diff" ] || echo "$diff" | grep -qiE 'did not modify|no modified files'; then
            echo "format clean on changed lines"; exit 0
          fi
          echo "$diff"
          echo "::warning::clang-format would change the above changed lines — run 'make format' (advisory, not blocking)"
          exit 0
      # Dependency pins. BLOCKING, and deliberately here rather than in the CUDA
      # Build job: Build restores a Docker layer cache, which is exactly what
      # hides a broken pin. On 2026-08-14 the CUTLASS pin read `4.7.0` while the
      # tag upstream is `v4.7.0`, so every build from a cold cache failed while
      # cached ones stayed green; three of the four Dockerfile ARG defaults had
      # also drifted behind the pins they mirror.
      - name: Dependency pins (drift + upstream tags)
        run: bash scripts/check_dep_pins.sh --online

  # File-size gate (recompile blast-radius smell). Own ubuntu job — independent of
  # the slow CUDA Build, needs no toolchain, just Python 3.11+ for tomllib. Two
  # steps by design: an ADVISORY warn display (never fails) and a BLOCKING hard-
  # review gate (fails only on a NON-allowlisted file over its hard threshold).
  # Thresholds + allowlist live in tools/filesize_thresholds.toml; baseline state
  # is documented in docs/audit/AUDIT_FILESIZE.md. See CLAUDE.md "File Layout & Size".
  filesize:
    name: File size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: File-size smells (advisory, non-blocking)
        run: python3 tools/check_filesize.py --warn-only
      # The blocking checks live in scripts/ci_static_gates.sh, which the `Build`
      # job also runs so a red gate fails the one required context. This job
      # keeps them a named check: "which gate failed" is worth a check name, and
      # the filter means there is one list rather than two that drift.
      - name: File-size gates (blocking)
        run: bash scripts/ci_static_gates.sh filesize

  # Documentation layer contract (docs/audit/docs-rewrite/). Seven checks, all
  # of which map to a defect this repo actually shipped: a datacenter-Blackwell
  # feature named as an imp feature, a throughput number that outlived its
  # measurement, a generated block hand-edited away from the baseline it claims
  # to mirror. Ubuntu job, no toolchain, seconds.
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Doc gates (blocking)
        run: bash scripts/ci_static_gates.sh docs

  hygiene:
    name: Release hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Release hygiene gate (blocking)
        run: bash scripts/ci_static_gates.sh hygiene

  alloc-sites:
    name: Alloc sites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Alloc-site gates (blocking)
        run: bash scripts/ci_static_gates.sh alloc

  launchguards:
    name: Launch guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Launch-guard gate (blocking)
        run: bash scripts/ci_static_gates.sh launchguards

  # ASan + UBSan over the CPU test binaries, including the fuzz corpus (#1621).
  #
  # Before this job no CI lane ran any sanitizer in any category: ASAN/UBSAN
  # existed behind a manual `make asan`, the one job that mentions
  # compute-sanitizer is gated on a GPU runner the owner decided against, and
  # its memcheck step is `continue-on-error` anyway.
  #
  # It is what makes the fuzz corpus worth running. Measured against the four
  # reverted parser fixes, per target:
  #
  #             without ASan      with ASan
  #   schema    green             stack-overflow
  #   regex     hang              hang
  #   gbnf      SEGV              stack-overflow
  #   tokenizer hang              heap-use-after-free
  #
  # An out-of-bounds read is invisible without it: the process reads a
  # neighbouring allocation and carries on.
  #
  # PR runs are gated on the parser/loader paths so the CUDA build is not paid
  # on every PR; nightly and workflow_dispatch always run it. Advisory in
  # practice like every job except `Build` (ruleset 14716423 requires that one
  # context) - so read it after a merge, not only before.
  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04
    # This image ships no bash, so GitHub picks `sh -e {0}` and any bashism is a
    # syntax error at step start. The first version used a here-string and the
    # job died in 1m15s before building anything - with `Build` the only
    # required check, that merged. Declared explicitly, and bash installed below.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install toolchain
        shell: sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash git python3 cmake ninja-build ca-certificates

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Does this run need the sanitizer build?
        id: scope
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$base" HEAD)"
              # Fail-open: an unreadable diff runs the job.
              # grep -q exits at the first match and pipefail turns the
              # producer EPIPE into a non-zero pipeline (#1499): here-string.
              if ! grep -qE '^(fuzz/|tests/test_fuzz_corpus|src/compute/json_schema|src/compute/gbnf|src/model/(safetensors_loader|tokenizer|json_util)|tools/imp-server/tool_stream_filter|CMakeLists.txt|\.github/workflows/ci\.yml)' <<< "$files"; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sanitizer build: run=$run"

      - name: Fetch pinned deps
        if: steps.scope.outputs.run == 'true'
        run: |
          # Two separate traps, both hit on the way here. The pin line is
          #   set(IMP_DEP_GOOGLETEST_TAG    v1.18.0  CACHE STRING "...")
          # with RUN-LENGTH whitespace, so a pattern with one space matches
          # nothing, grep exits 1 and `-e` kills the step with no message at
          # all. And `grep | head -1` under `-o pipefail` is #1499: head closes
          # the pipe, grep dies of EPIPE, the pipeline is non-zero even on a
          # hit. `\s+` fixes the first, `-m1` instead of a pipe the second.
          GT="$(grep -m1 -oP 'IMP_DEP_GOOGLETEST_TAG\s+\K[^ )]+' cmake/imp-deps.cmake)"
          test -n "$GT" || { echo "googletest pin not found in cmake/imp-deps.cmake"; exit 1; }
          echo "googletest pin: $GT"
          git clone --depth=1 --branch "$GT" https://github.com/google/googletest.git /deps/googletest

      # No tools, no bench, no server: the same configuration `make asan` uses,
      # which is also why the five unconditional fuzz targets must not live in
      # the IMP_BUILD_SERVER block - the first version of them did, and the
      # sanitizer binary silently contained none of them (0 tests, "PASSED").
      - name: Build test-core + test-text with ASan/UBSan
        if: steps.scope.outputs.run == 'true'
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DIMP_SANITIZERS=ON \
            -DIMP_BUILD_TOOLS=OFF -DIMP_BUILD_BENCH=OFF -DIMP_BUILD_SERVER=OFF \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=/deps/googletest
          cmake --build build-asan --target test-core test-text -j"$(nproc)"

      # A binary that contains none of the tests reports "PASSED 0 tests" and
      # exits 0. That is how the first version of this job would have gone green
      # without running anything.
      # test-core links libcuda.so.1 and this runner has no driver, so the
      # binary does not start: `error while loading shared libraries`. The CUDA
      # image ships a stub for exactly this, under the name the linker wants but
      # not the one the loader wants (libcuda.so, not .so.1) - hence the symlink.
      # CUDA calls then fail at runtime, which is what the CPU lane expects
      # anyway: those tests skip.
      #
      # Found only after making the assert print stderr. My first guess was the
      # known ASan-vs-high-ASLR crash on Ubuntu 24.04; it was not that.
      - name: CUDA driver stub (no GPU on this runner)
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cudastub"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cudastub/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cudastub" >> "$GITHUB_ENV"

      - name: Assert the fuzz corpus is in the binary
        if: steps.scope.outputs.run == 'true'
        run: |
          # `2>/dev/null` here hid WHY on the first red run: an ASan binary that
          # cannot start prints to stderr and lists nothing, which reads
          # identical to a binary built without the tests. Keep stderr.
          ./build-asan/test-core --gtest_list_tests > /tmp/tests.txt
          if ! grep -q '^FuzzCorpus' /tmp/tests.txt; then
            echo "FuzzCorpus missing from the sanitizer binary."
            echo "suites it does have:"
            grep -E '^[A-Za-z]' /tmp/tests.txt | head -40
            exit 1
          fi

      # Measured locally on this tree, GPU-less, same flags: test-core 741 pass,
      # test-text 200 pass, no ASan report. FuzzCorpus.Regex is 11 s of that
      # under ASan against 0.5 s without - the NFA compiler over 1500 mutations
      # is what the sanitizer slows down.
      - name: Run
        if: steps.scope.outputs.run == 'true'
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=tools/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=tools/sanitizers/ubsan.supp
        run: |
          ./build-asan/test-core
          ./build-asan/test-text

  test:
    name: Test
    needs: build
    # GPU tests need a self-hosted runner with NVIDIA GPU. To turn this lane on:
    #
    #   1. On the GPU box: Settings → Actions → Runners → New self-hosted runner,
    #      and give it the labels  self-hosted, gpu, cuda  (all three; the
    #      runs-on below requires the full set).
    #   2. Settings → Secrets and variables → Actions → Variables → new variable
    #      HAS_GPU_RUNNER = true.
    #   3. Optional: set IMP_MODELS_DIR on the runner to the directory holding
    #      the baseline GGUF, or the perf gate below skips instead of running.
    #
    # This is the only lane that runs the full ctest, compute-sanitizer and the
    # perf gate — everything else in CI is CPU-only. Until step 2, the job is
    # skipped rather than failing. Until then,
    # this job is skipped — same effective behavior as the prior `if: false`,
    # but flips automatically when a runner appears. Also skipped on docs-only
    # changes (build uploads no artifact then — nothing to download/test).
    if: ${{ vars.HAS_GPU_RUNNER == 'true' && needs.build.outputs.code == 'true' }}
    runs-on: [self-hosted, gpu, cuda]

    steps:
      - uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: imp-build
          path: build/

      - name: Run tests
        run: |
          chmod +x build/imp-tests || true
          chmod +x build/test-* 2>/dev/null || true
          cd build && ctest --output-on-failure --timeout 120

      # compute-sanitizer (memcheck) — the real "linter" for CUDA kernels: catches
      # out-of-bounds, misaligned and use-after-free device accesses that clang-tidy
      # fundamentally cannot see (it parses no .cu). Advisory for now (continue-on-
      # error); scoped to the kernel-heavy binaries to bound the ~10-30x slowdown.
      # Mirrors the local `make sanitize` target. Flip to a hard gate once clean.
      - name: compute-sanitizer (memcheck, advisory)
        continue-on-error: true
        run: |
          SAN="$(command -v compute-sanitizer || echo /usr/local/cuda/bin/compute-sanitizer)"
          # Fast kernel binaries only — memcheck is ~10-30x, so the slow FA2 sweeps
          # in test-attention are deliberately excluded to keep this advisory step
          # bounded (run it there on demand via `make sanitize`).
          for b in test-kv test-moe-gdn test-quant; do
            echo "== compute-sanitizer memcheck: $b =="
            chmod +x "build/$b" 2>/dev/null || true
            "$SAN" --tool memcheck --error-exitcode 1 --leak-check no "build/$b" \
              || { echo "::warning::compute-sanitizer flagged $b"; }
          done

      # Perf regression gate against tests/perf_baseline.json (decode 3% / prefill 5%).
      # Previously this gate lived ONLY in the local pre-push hook (scripts/verify.sh),
      # so a decode regression could reach main unflagged — exactly what happened with
      # the FP8-disable × FP16-widen interaction (Qwen3-8B Q8_0 tg128 284→146). This
      # step closes that gap. Skips (does not fail) when the baseline model isn't on
      # the runner — set IMP_MODELS_DIR to the directory holding the baseline GGUF.
      - name: Perf regression gate
        # Logic extracted to scripts/bench_gate.sh so the same gate runs locally
        # (scripts/verify.sh) and here. Skips when the baseline model isn't on the
        # runner; set IMP_MODELS_DIR to the directory holding the baseline GGUF.
        run: |
          chmod +x build/imp-cli scripts/bench_gate.sh || true
          scripts/bench_gate.sh build/imp-cli tests/perf_baseline.json
