name: Auto-merge own PRs

# Enables auto-merge (squash) automatically on PRs opened by the repo owner.
# GitHub then merges the PR as soon as required checks pass and the branch
# is mergeable. Saves the manual "Enable auto-merge" click on every PR.
#
# Scope:
# - Only PRs authored by the repo owner; community PRs still need manual review.
# - Skips drafts; transitions to ready_for_review re-fire and enable auto-merge.
# - Squash mode (matches the repo default visible in `viewerDefaultMergeMethod`).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # --delete-branch is not redundant with the repository's
        # deleteBranchOnMerge setting. An auto-merge request carries its own
        # delete preference, and that is what GitHub honours at merge time, so
        # arming without the flag leaves the head branch behind however the
        # repository is configured. Measured 2026-08-21: #1531 armed by this
        # workflow left its branch; #1532, re-armed by hand with the flag in the
        # same hour, deleted its own. 21 branches had accumulated that way.
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
