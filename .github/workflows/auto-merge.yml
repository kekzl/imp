name: Auto-merge own PRs

# Enables auto-merge (squash) automatically on PRs opened by the repo owner.
# GitHub then merges the PR as soon as required checks pass and the branch
# is mergeable. Saves the manual "Enable auto-merge" click on every PR.
#
# Scope:
# - Only PRs authored by the repo owner; community PRs still need manual review.
# - Skips drafts; transitions to ready_for_review re-fire and enable auto-merge.
# - Squash mode (matches the repo default visible in `viewerDefaultMergeMethod`).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable squash auto-merge
        env:
          # The merge is attributed to the token that armed auto-merge. Armed with
          # GITHUB_TOKEN it starts no push run on main (GitHub loop prevention) and
          # leaves the head branch (#2141-#2147: 0 of 7 main commits got CI, 7 of 7
          # branches stayed). AUTO_MERGE_TOKEN (fine-grained PAT, this repo only:
          # Contents + Pull requests read/write) fixes both; GITHUB_TOKEN is the
          # fallback while the secret is unset.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
