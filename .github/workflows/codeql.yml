name: CodeQL

# Code scanning, free on this public repo. build-mode none: no CUDA toolchain on the runner;
# C/C++ none mode is public preview and may miss alerts; .cu kernels are not the target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"  # nightly: c-cpp left the main push (M10)
  workflow_dispatch:

# Push: one group per commit (a shared one queued 63 main push jobs > 60 s, max 723 s).
concurrency:
  group: codeql-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # c-cpp on PR, nightly and dispatch, not on a main push: analyze median 510 s per push.
        language: ${{ github.event_name == 'push' && fromJSON('["python","actions"]') || fromJSON('["c-cpp","python","actions"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths:
              - src
              - include
              - tools
              - scripts
              - .github/workflows
            paths-ignore:
              - tools/imp-server/webui

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results

      # third_party/ is vendored upstream (stb == nothings/stb master byte for byte), not patched here.
      # paths/paths-ignore do not drop C/C++ results in headers #included from src/, so filter the SARIF.
      - name: Drop results in vendored third_party/
        run: |
          for f in sarif-results/*.sarif; do
            jq '.runs[].results |= map(select((.locations[0].physicalLocation.artifactLocation.uri // "") | startswith("third_party/") | not))' \
              "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
